<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimCity 2050</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/advisors.css">
<link rel="stylesheet" href="css/tutorial.css">
<link rel="stylesheet" href="css/sound.css">
<link rel="stylesheet" href="css/view3d-camera.css">
<link rel="stylesheet" href="css/ordinances.css">
<link rel="stylesheet" href="css/water.css">
<link rel="stylesheet" href="css/transit.css">
<link rel="stylesheet" href="css/deals.css">
<link rel="stylesheet" href="css/agents.css">
<link rel="stylesheet" href="css/structures.css">
<link rel="stylesheet" href="css/zoning.css">
<link rel="stylesheet" href="css/waste.css">
<link rel="stylesheet" href="css/services.css">
<link rel="stylesheet" href="css/energy.css">
</head>
<body>
<header>
  <h1>SimCity 2050</h1>
  <select id="city" aria-label="Ville">
    <option value="haight">Haight-Ashbury</option>
    <option value="kyoto">Kyoto</option>
    <option value="yokohama">Yokohama</option>
  </select>
  <label class="btn">Ouvrir un fichier <input id="file" type="file" accept=".cty,.mcty" hidden></label>
  <button id="save" disabled>Enregistrer</button>
  <button id="saves-toggle" type="button">Parties</button>
  <button id="play" aria-pressed="false" disabled>▶ Lecture</button>
  <button id="view3d" type="button" aria-pressed="false" disabled>Vue 3D</button>
  <label>Vitesse <input id="speed" type="range" min="1" max="3" value="2"></label>
  <label><input id="disasters" type="checkbox"> Catastrophes</label>
  <div id="rules-controls">
    <label id="relief-label" title="Construire sur une pente coûte du terrassement ; les routes en pente coûtent plus cher ; outils pour relever et abaisser le terrain."><input id="relief" type="checkbox"> Règles de relief</label>
  </div>
  <div id="newcity" class="newcity" hidden>
    <button id="newcity-btn" type="button">Nouvelle ville</button>
    <label>Taille <select id="size" aria-label="Taille de la carte">
      <option value="normal">Normal (120 × 100)</option>
      <option value="grande">Grande (200 × 150)</option>
      <option value="tres-grande">Très grande (300 × 250)</option>
      <option value="custom">Personnalisée</option>
    </select></label>
    <span id="size-custom" hidden>
      <label>Largeur <input id="size-w" type="number" inputmode="numeric" min="80" max="512" step="1" value="120" size="4"></label>
      <label>Hauteur <input id="size-h" type="number" inputmode="numeric" min="67" max="512" step="1" value="100" size="4"></label>
    </span>
    <label>Graine <input id="seed" type="text" inputmode="numeric" autocomplete="off" placeholder="au hasard" size="11"></label>
    <span id="new-msg" role="status"></span>
    <span id="save-note" role="status"></span>
  </div>
  <div id="view-modes" role="group" aria-label="Vues de la carte" hidden></div>
  <div id="sound-controls" hidden></div>
  <span id="status" role="status">Chargement…</span>
</header>
<nav id="palette" aria-label="Outils de construction" hidden inert></nav>
<main>
  <div id="map-frame" class="map-frame" inert>
    <canvas id="map" aria-label="Carte de la ville"></canvas>
    <canvas id="map3d" aria-label="Carte de la ville en 3D"></canvas>
    <canvas id="overlay" aria-hidden="true" hidden></canvas>
    <div id="view3d-controls" role="group" aria-label="Caméra 3D" hidden></div>
  </div>
  <div id="resume-banner" class="box" role="region" aria-label="Reprendre la partie" hidden></div>
  <p id="tool-msg" role="status" aria-live="polite"></p>
  <p id="load-msg" class="alert" role="status" aria-live="polite"></p>
  <div id="query-panel" aria-live="polite" hidden></div>
  <p id="stats" aria-live="polite"></p>
  <section id="tutorial-panel" class="box" aria-label="Premiers pas" hidden></section>
  <section id="advisors-panel" class="box" aria-label="Conseillers" hidden></section>
  <section id="ordinances-panel" class="box" aria-label="Ordonnances" hidden></section>
  <section id="deals-panel" class="box" aria-label="Accords avec les voisins" hidden></section>
  <section id="agents-panel" class="box" aria-label="Circulation simulée" hidden></section>
  <section id="structures-panel" class="box" aria-label="Bâtiments étendus" hidden></section>
  <section id="zoning-panel" class="box" aria-label="Densités de zonage" hidden></section>
  <section id="waste-panel" class="box" aria-label="Déchets" hidden></section>
  <section id="services-panel" class="box" aria-label="Services publics" hidden></section>
  <section id="energy-panel" class="box" aria-label="Énergie" hidden></section>
  <section id="messages-panel" class="box" aria-label="Messages de la ville" hidden></section>
  <section id="budget-panel" class="box" aria-label="Budget et évaluation" hidden></section>
  <section id="saves-panel" class="box" aria-label="Parties sauvegardées" hidden></section>
  <details id="legend-box" class="box" open>
    <summary>Légende des couleurs</summary>
    <ul id="legend" class="legend"></ul>
  </details>
  <details id="help-box" class="box" hidden>
    <summary>Raccourcis clavier</summary>
    <dl id="shortcuts" class="shortcuts"></dl>
  </details>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
